name: ci
# On demand only (owner, 2026-10-21): CI costs money, so it never runs on
# pushes or pull requests. Validate locally with `make ci`; run this
# workflow by hand (gh workflow run ci) at the end of a batch.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - name: Standard library only
        shell: bash
        run: |
          deps=$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./... | grep -v '^github.com/convergent-systems-co/gip-sdk-go' || true)
          test -z "$deps" || (echo "non-stdlib dependencies: $deps" && exit 1)
